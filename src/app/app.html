<header class="navbar">
  <div class="nav-container">
    <!-- Brand Logo / Title -> Navigates to Dashboard -->
    <a routerLink="/dashboard" class="brand-logo" (click)="closeMobileMenu()">
      <span class="logo-icon">⚡</span>
      <span class="brand-name">Bodycraft</span>
    </a>

    <!-- Hamburger Menu Toggle for Mobile & Tablet -->
    <button class="mobile-toggle" (click)="toggleMobileMenu()" aria-label="Toggle Navigation">
      <span class="hamburger-bar" [class.open]="isMobileMenuOpen()"></span>
      <span class="hamburger-bar" [class.open]="isMobileMenuOpen()"></span>
      <span class="hamburger-bar" [class.open]="isMobileMenuOpen()"></span>
    </button>

    <!-- Desktop & Mobile Navigation links -->
    <nav class="nav-menu" [class.mobile-open]="isMobileMenuOpen()">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()">
        Dashboard
      </a>
      <a routerLink="/workout" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()">
        Workouts
      </a>
      <a routerLink="/nutrition" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()">
        Nutrition
      </a>
      <a routerLink="/checkin" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()">
        Check-In
      </a>
      <a routerLink="/membership" routerLinkActive="active" class="nav-link nav-item" (click)="closeMobileMenu()">
        Membership
      </a>
      <a routerLink="/onboarding" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()">
        Profile
      </a>
    </nav>
  </div>
</header>

<main class="main-layout">
  <router-outlet></router-outlet>
</main>
